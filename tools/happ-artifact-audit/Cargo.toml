[package]
name = "happ-artifact-audit"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
mr_bundle = { version = "=0.6.3", features = ["fs"] }
