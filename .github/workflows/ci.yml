name: CI

on:
  push:
    branches: [main, ci-fix]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# A new push cancels the older run on the same branch or PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Everything that runs without a Holochain conductor: shared/host/hApp unit tests, sweetest
  # harness lib tests, schema and SDK fixture checks, web and SDK vitest.
  light:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Install nix
        uses: cachix/install-nix-action@v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.28.3/install

      - uses: cachix/cachix-action@v17
        with:
          name: holochain-ci

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: light

      - name: Free disk space before test job
        run: |
          echo "Disk usage before cleanup:"
          df -h
          rm -rf "$AGENT_TOOLSDIRECTORY" || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo docker system prune -af || true
          echo "Disk usage after cleanup:"
          df -h

      - name: Install dependencies
        run: |
          nix develop --command bash -c "npm ci"

      - name: Check SDK wire fixtures are up to date
        run: |
          nix develop --command bash -c "npm run regen:sdk-fixtures && git diff --exit-code host/map-sdk/tests/fixtures/"

      - name: Verify schema source artifacts and fidelity
        run: |
          nix develop --command bash -c "npm run map-schema:verify:coreschema"

      - name: Light tests
        env:
          CARGO_INCREMENTAL: "0"
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: |
          nix develop --command bash -c "npm run test:light"

  # Sweettests: builds the hApp and probe WASM, then boots a Holochain conductor per test.
  # Each shard runs the test binaries selected by its `ci-<shard>` profile in .config/nextest.toml.
  heavy:
    name: heavy (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [storage, rest]
    steps:
      - uses: actions/checkout@v5

      - name: Install nix
        uses: cachix/install-nix-action@v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.28.3/install

      - uses: cachix/cachix-action@v17
        with:
          name: holochain-ci

      # Also cache the hApp WASM workspace; both shards restore, one saves. Save even when tests
      # fail, so a red run does not throw away the ~17 minute sweettest build.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: heavy
          workspaces: |
            . -> target
            happ -> target
          save-if: ${{ matrix.shard == 'rest' }}
          cache-on-failure: true

      # No cleanup: the runner has ~85 GB free and a heavy run uses well under that; the old
      # docker prune and SDK removals cost ~3 minutes.
      - name: Disk usage
        run: df -h

      - name: Install dependencies
        run: |
          nix develop --command bash -c "npm ci"

      # SQLCipher mlocks its key buffers; the runner's default RLIMIT_MEMLOCK (~64 KB) is exhausted
      # by each conductor's encrypted databases, which logs `sqlcipher_mlock ... errno=12`. Raise the
      # limit for this shell so the nix/cargo/test children inherit it; `ulimit -l` confirms it.
      # MAP_TEST_RUN_ROOT puts scripts/test-run.sh's TMPDIR, and so each conductor's database
      # files, on tmpfs instead of runner disk. The test_context RUST_LOG directive prints the
      # per-phase `[PERF-688] sweettest_bootstrap` timings, a few lines per test.
      - name: Heavy tests
        env:
          CARGO_INCREMENTAL: "0"
          CARGO_PROFILE_DEV_DEBUG: "0"
          MAP_NEXTEST_PROFILE: ci-${{ matrix.shard }}
          MAP_TEST_RUN_ROOT: /dev/shm/map-test-runs
          RUST_LOG: warn,holons_test::harness::helpers::test_context=info
        run: |
          sudo prlimit --pid $$ --memlock=unlimited:unlimited
          nix develop --command bash -c "ulimit -l && npm run test:heavy"

      # Keep the production-surface policy visible as its own CI gate. `npm run test:heavy` builds
      # the production bundles and loose probe WASM before reaching this deterministic re-audit.
      # Identical in every shard, so it runs once.
      - name: Check packaged coordinator surfaces
        if: matrix.shard == 'rest'
        run: |
          nix develop --command bash -c "npm run check:happ-artifacts"

  # The dance_tests suites (one bootstrap each, then many scenarios) exceed 30 minutes per suite
  # on a hosted runner, which does not fit a heavy shard. They run here with a long limit so they
  # finish and report real durations. TEMP: not required by ci_pass until those durations are
  # known and the suites fit a normal job; the steps mirror `heavy` and restore its cache.
  # The dance_test_runner directive adds a timestamped `STARTING STEP` line per scenario step.
  dance:
    if: false  # TEMP: both dance suites are skipped in CI (see the ci-dance profile); re-enable with them
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5

      - name: Install nix
        uses: cachix/install-nix-action@v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.28.3/install

      - uses: cachix/cachix-action@v17
        with:
          name: holochain-ci

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: heavy
          workspaces: |
            . -> target
            happ -> target
          save-if: false

      - name: Disk usage
        run: df -h

      - name: Install dependencies
        run: |
          nix develop --command bash -c "npm ci"

      - name: Dance tests
        env:
          CARGO_INCREMENTAL: "0"
          CARGO_PROFILE_DEV_DEBUG: "0"
          MAP_NEXTEST_PROFILE: ci-dance
          MAP_TEST_RUN_ROOT: /dev/shm/map-test-runs
          RUST_LOG: warn,holons_test::harness::helpers::test_context=info,dance_tests::execution_steps::dance_test_runner=info
        run: |
          sudo prlimit --pid $$ --memlock=unlimited:unlimited
          nix develop --command bash -c "ulimit -l && npm run test:heavy"

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install nix
        uses: cachix/install-nix-action@v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.28.3/install

      - uses: cachix/cachix-action@v17
        with:
          name: holochain-ci

      - uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: |
          nix develop --command bash -c "npm ci"

      - name: Check formatting
        run: |
          nix develop --command bash -c "npm run fmt:check || (echo 'Formatting check failed. Run: npm run fmt' && exit 1)"

#  lint:
#    continue-on-error: true  # 👈 Make this advisory only
#    runs-on: ubuntu-latest
#    steps:
#      - uses: actions/checkout@v5
#
#      - name: Install nix
#        uses: cachix/install-nix-action@v31
#        with:
#          install_url: https://releases.nixos.org/nix/nix-2.28.3/install
#
#      - name: Clippy lint
#        run: |
#          nix develop --command cargo clippy --all-features -- -D warnings

  ci_pass:
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs: [ light, heavy, fmt ]  # 👈 exclude 'lint'; 'dance' is TEMP non-required (see above)
    steps:
      - name: Check status
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
