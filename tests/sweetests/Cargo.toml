[package]
name = "holons_test"
version = "0.1.0"
edition = "2021"
publish = false

# (You can omit [lib] entirely unless you need a custom crate-type or name)

[dependencies]
# Workspace shared_crates (prefer workspace deps over path for consistency)

# General deps
async-trait = "0.1.51"
derive-new = "0.7"
serde = { version = "1", features = ["derive"] }
# Holochain sweettest stack (pin as you already do)
holochain = { version = "0.6", default-features = false, features = [
    "sweettest",
    "wasmer_sys",
    "transport-iroh"
] }
holochain_state = "0.6"
# The preflight assertion downcasts Wasmer's source error to the exact guest error payload.
# Holochain consumes this same crate/version transitively but does not re-export these types.
holochain_wasmer_common = "0.0.102"


# Workaround: iroh-base-holochain (latest is 0.95.2) still hard-pins
# ed25519-dalek = "=3.0.0-pre.1" and curve25519-dalek = "=5.0.0-pre.1", which fail
# to compile against released RustCrypto crates. pkcs8 0.11.0 breaks ed25519
# 3.0.0-rc.x (`?` can't convert Error::KeyMalformed), so pkcs8 must stay on the RC.
# Re-verified against holochain 0.6.3 on 2026-07-27 — still required.
# Remove once iroh-base-holochain publishes a release that unpins ed25519-dalek.
# (An `ed25519 = "=3.0.0-rc.0"` pin used to live here too; it is no longer needed —
# resolution lands on ed25519 3.0.0-rc.4, which compiles fine against the -pre.1 dalek.)
pkcs8 = "=0.11.0-rc.11"


pretty_assertions = "1.4.0"
#serde = { version = "1", features = ["derive"] }
#serde_json = "1.0.109"
tracing = "0.1"
tracing-subscriber = "0.3"
# Needed to build the `Url2` values that `NetworkConfig`'s endpoint fields hold, so the test
# conductor can be pointed at local-only addresses. Already in the root lock as a transitive
# holochain dependency at this exact version, so this adds no new resolution.
url2 = "0.0.6"
# RustCrypto RC pins: ed25519-dalek 3.0.0-pre.1 + curve25519-dalek 5.0.0-pre.1
# require digest::crypto_common which was removed in digest 0.11.3 (stable).
# Pin sha1/sha2 to their RC releases so the digest RC chain is selected.
sha2 = "=0.11.0-rc.2"
sha1 = "=0.11.0-rc.2"
digest = "=0.11.0-rc.3"
# Guards against uuid v4 resolving rand → 0.10 → chacha20 0.10.0, which would
# conflict with iroh-holochain's exact pin chacha20 =0.10.0-rc.2.
# The companion `rand = "0.9"` pin was dropped on 2026-07-27: holochain 0.6.3
# declares `rand ^0.9` itself, and a from-scratch resolve without the pin lands
# on rand 0.9.5 / chacha20 0.10.0-rc.2 cleanly.
uuid = { version = "=1.21.0", features = ["serde"] }

[dependencies.holons_prelude]
path = "../../shared_crates/holons_prelude"

#[dependencies.holons_guest_integrity]
#path = "../../shared_crates/holons_guest_integrity"
#
[dependencies.holon_dance_builders]
path = "../../shared_crates/holon_dance_builders"

[dependencies.holons_core]
path = "../../shared_crates/holons_core"

[dependencies.holons_boundary]
path = "../../shared_crates/holons_boundary"

[dependencies.holons_client]
path = "../../host/crates/holons_client"

[dependencies.holons_loader_client]
path = "../../host/crates/holons_loader_client"

[dependencies.holons_trust_channel]
path = "../../shared_crates/holons_trust_channel"

[dependencies.type_names]
path = "../../shared_crates/type_system/type_names"

[dependencies.core_types]
path = "../../shared_crates/type_system/core_types"

[dependencies.integrity_core_types]
path = "../../shared_crates/type_system/integrity_core_types"

[dependencies.base_types]
path = "../../shared_crates/type_system/base_types"

[dependencies.map_commands_contract]
path = "../../host/crates/map_commands_contract"

[dependencies.map_commands_runtime]
path = "../../host/crates/map_commands_runtime"

[dev-dependencies.holons_trust_channel]
path = "../../shared_crates/holons_trust_channel"

[dev-dependencies]
rstest = "0.26.1"
pretty_assertions = "1.4"
#futures = { version = "0.3.1", default-features = false }
tokio = { version = "1", features = ["full"] }
#async-std = "1"
