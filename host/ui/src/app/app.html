@if (failure()) {
  <main class="launcher-error" data-dahn-launcher-state="failed" role="alert">
    <h1>MAP Application Launcher failed</h1>
    <p>{{ failure() }}</p>
  </main>
} @else if (experience() === 'canvas') {
  <app-canvas-host></app-canvas-host>
} @else if (experience() === 'holons-loader') {
  <app-holons-loader-host></app-holons-loader-host>
}
