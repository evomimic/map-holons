<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src ipc: http://ipc.localhost; img-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Welcome to MAP</title>
  <link rel="stylesheet" href="welcome.css">
  <script src="welcome.js" defer></script>
</head>
<body>
  <main>
    <h1>Welcome to MAP</h1>
    <p id="introduction">Your personal space is yours to constitute.</p>
    <p id="status" role="status">Checking availability…</p>
    <fieldset id="personal-name" disabled hidden>
      <legend>Your name</legend>
      <label for="first-name">First name (optional)</label>
      <input id="first-name" name="firstName" autocomplete="given-name">
      <label for="middle-name">Middle name (optional)</label>
      <input id="middle-name" name="middleName" autocomplete="additional-name">
      <label for="last-name">Last name</label>
      <input id="last-name" name="lastName" autocomplete="family-name" required>
    </fieldset>
    <button id="constitute" type="button" disabled>Create my personal space</button>
  </main>
</body>
</html>
